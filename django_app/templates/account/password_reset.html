{% extends "html/_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Reset Password | AI Face Analysis System{% endblock %}

{% block content %}
    <div class="container">
        <div class="dark-blue-window">
            <h1>Reset password</h1>
        </div>
        <div class="work-section">
            <h5>Enter your email address and we will send password reset instructions.</h5>
            <form method="post" action="{% url 'account_reset_password' %}">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="submit-form">Confirm</button>
            </form>
        </div>
    </div>
{% endblock %}
