{% extends "html/_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Sign Out | AI Face Analysis System{% endblock %}

{% block content %}
    <div class="container">
        <div class="dark-blue-window">
            <h1>Sign out</h1>
        </div>
        <div class="work-section">
            <h2>Are you sure you want to sign out?</h2>
            <form method="post" action="{% url 'account_logout' %}">
                {% csrf_token %}
                {{ form|crispy }}
                <button class="submit-form" type="submit">Confirm</button>
            </form>
        </div>
    </div>
{% endblock %}
