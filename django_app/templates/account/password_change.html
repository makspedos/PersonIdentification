{% extends "html/_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Change Password | AI Face Analysis System{% endblock %}

{% block content %}
    <div class="container">
        <div class="dark-blue-window">
            <h1>Change password</h1>
        </div>
        <div class="work-section">
            <form method="post" action="{% url 'account_change_password' %}">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="submit-form">Confirm</button>
            </form>
        </div>
    </div>
{% endblock %}
