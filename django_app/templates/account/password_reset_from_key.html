{% extends "html/_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Set New Password | AI Face Analysis System{% endblock %}

{% block content %}
    <div class="container">
        <div class="dark-blue-window">
            <h1>Set new password</h1>
        </div>
        <div class="work-section">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="submit-form2">Confirm</button>
            </form>
        </div>
    </div>
{% endblock %}
