{% extends "html/_base.html" %}
{% load crispy_forms_tags %}

{% block title %}Change Username | AI Face Analysis System{% endblock %}

{% block content %}
    <div class="container">
        <div class="dark-blue-window">
            <h1>Change username</h1>
        </div>
        <div class="work-section">
            <form method="post" action="{% url 'accounts:username' %}">
                {% csrf_token %}
                <label for="username">Enter a new username</label>
                <input id="username" type="text" name="username" value="{{ user.username }}">
                <button type="submit" class="submit-form">Confirm</button>
            </form>
        </div>
    </div>
{% endblock %}
